name: Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload Windows Build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Agentic Vnus v1.0.0"
          draft: false
          prerelease: false
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload Mac Intel Build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Agentic Vnus v1.0.0"
          draft: false
          prerelease: false
          files: dist/*-x64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - run: npm run build:mac:arm
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload Mac ARM Build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Agentic Vnus v1.0.0"
          draft: false
          prerelease: false
          files: dist/*-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2t64 libpango-1.0-0 libcairo2
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - run: npm run build:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload Linux Build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Agentic Vnus v1.0.0"
          draft: false
          prerelease: false
          files: dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}