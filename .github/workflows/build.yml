name: Build & Release

on:
  push:
    branches: [main, master]
    tags:     ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:

  # ── Windows ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      - name: Build Windows
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_NO_PUBLISH: true
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe
          if-no-files-found: warn

  # ── Mac Intel (x64) ─────────────────────────────────────
  build-mac-x64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      - name: Build Mac x64
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_NO_PUBLISH: true
      - uses: actions/upload-artifact@v4
        with:
          name: mac-x64-build
          path: dist/*-x64.dmg
          if-no-files-found: warn

  # ── Mac Apple Silicon (arm64) ───────────────────────────
  build-mac-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      - name: Build Mac arm64
        run: npm run build:mac:arm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_NO_PUBLISH: true
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-build
          path: dist/*-arm64.dmg
          if-no-files-found: warn

  # ── Linux ────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2t64 libpango-1.0-0 libcairo2
      - name: Install dependencies
        run: npm install
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      - name: Build Linux
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_NO_PUBLISH: true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*.AppImage
          if-no-files-found: warn

  # ── Release (sirf v* tags pe) ───────────────────────────
  release:
    needs: [build-windows, build-mac-x64, build-mac-arm64, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List files
        run: find artifacts -type f
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-build/*.exe
            artifacts/mac-x64-build/*.dmg
            artifacts/mac-arm64-build/*.dmg
            artifacts/linux-build/*.AppImage
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}